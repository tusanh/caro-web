<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chọn chế độ chơi</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        button {
            margin: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #2196f3;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chọn chế độ chơi</h1>
        <button onclick="location.href='play-bot.html'">Chơi với Bot</button>
        <button onclick="alert('Chế độ online sẽ sớm có!')">Chơi Online</button>
        <br><br>
        <button onclick="logout()">Đăng xuất</button>
    </div>

    <script>
        const user = localStorage.getItem("username");
        if (!user) window.location.href = "/index.html";

        function logout() {
            localStorage.removeItem("username");
            window.location.href = "/index.html";
        }
    </script>
</body>
</html>
